<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuenta Bancaria</title>
</head>
<body>
  <h1>Simulador de Cuenta Bancaria</h1>
  
  <p><strong>Titular:</strong> <span id="titular"></span></p>
  <p><strong>Saldo actual:</strong> $<span id="saldo"></span></p>

  <input type="number" id="cantidad" placeholder="Ingresa cantidad">
  <br><br>
  
  <button onclick="Depositar()">Depositar</button>
  <button onclick="Retirar()">Retirar</button>
  <button onclick="Consultar()">Consultar</button>

<script>
  const cuentaBancaria = {
    titular: "Emilio Campos",
    saldo: 1000,

    depositar(cantidad) {
      if (cantidad > 0) {
        this.saldo += cantidad;
        console.log(`Has depositado $${cantidad}. Nuevo saldo: $${this.saldo}`);
      } else {
        console.log("La cantidad a depositar debe ser mayor que 0.");
      }
    },

    retirar(cantidad) {
      if (cantidad > 0) {
        if (cantidad <= this.saldo) {
          this.saldo -= cantidad;
          console.log(`Has retirado $${cantidad}. Nuevo saldo: $${this.saldo}`);
        } else {
          console.log("Fondos insuficientes para realizar el retiro.");
        }
      } else {
        console.log("La cantidad a retirar debe ser mayor que 0.");
      }
    },

    consultarSaldo() {
      console.log(`Saldo actual: $${this.saldo}`);
      return this.saldo;
    }
  };

  document.getElementById("titular").textContent = cuentaBancaria.titular;
  document.getElementById("saldo").textContent = cuentaBancaria.saldo;

  function Depositar() {
    const cantidad = parseFloat(document.getElementById("cantidad").value);
    cuentaBancaria.depositar(cantidad);
    actualizarSaldo();
  }

  function Retirar() {
    const cantidad = parseFloat(document.getElementById("cantidad").value);
    cuentaBancaria.retirar(cantidad);
    actualizarSaldo();
  }

  function Consultar() {
    actualizarSaldo();
    alert("Saldo actual: $" + cuentaBancaria.consultarSaldo());
  }

  function actualizarSaldo() {
    document.getElementById("saldo").textContent = cuentaBancaria.saldo;
  }
</script>
</body>
</html>
